<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kowh.ai — Coming Soon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            position: relative;
            isolation: isolate;
            background-color: #eee9dc;
            color: #203b30;
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            z-index: -2;
            background: url('kowhai.watercolour.png') center / cover no-repeat;
        }
        body::after {
            z-index: -1;
            background: linear-gradient(90deg, rgba(250, 248, 239, 0.92) 0%, rgba(250, 248, 239, 0.78) 42%, rgba(250, 248, 239, 0.16) 100%);
        }
        @media (max-width: 640px) {
            body::after {
                background: linear-gradient(180deg, rgba(250, 248, 239, 0.88) 0%, rgba(250, 248, 239, 0.66) 58%, rgba(250, 248, 239, 0.36) 100%);
            }
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="w-full max-w-6xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="text-lg font-semibold tracking-wider text-[#203b30]">
            kowh<span class="text-[#875d27]">.ai</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-white/70 text-[#294b3d] border border-white/70">
                <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-[#547c52] animate-pulse"></span>
                In Development
            </span>
        </div>
    </header>

    <main class="flex-grow flex items-center px-6 py-8">
        <div class="max-w-6xl w-full mx-auto">
            <div class="max-w-xl text-left space-y-8">

                <div class="space-y-3">
                    <h1 class="text-4xl sm:text-6xl font-semibold tracking-tight text-[#203b30]">
                        kowh<span class="text-[#875d27]">.ai</span>
                    </h1>
                    <p class="text-lg sm:text-xl text-[#3f584b] font-light">
                        Personal site and workspace coming soon.
                    </p>
                </div>

                <div class="w-12 h-px bg-[#203b30]/25"></div>

                <div class="text-sm text-[#405749]">
                    Need to reach out? Drop a note at
                    <a href="mailto:brett@kowh.ai" class="text-[#76501d] hover:text-[#513512] transition-colors underline underline-offset-4">brett@kowh.ai</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mx-auto px-6 py-8 flex flex-col sm:flex-row justify-between items-center text-xs text-[#405749] border-t border-[#203b30]/15">
        <div>
            &copy; <span id="year"></span> kowh.ai. All rights reserved.
        </div>
        <div class="mt-2 sm:mt-0">
            Hosted on kowhub Pages
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
