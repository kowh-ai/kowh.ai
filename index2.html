<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kowh.ai Landing Page</title>
    <style>
        :root {
            --bg-color: #2c2c2c;
            --card-bg: #444444;
            --accent-color: #c4a35a;
            --text-color: #e0e0e0;
            --font-family: 'Arial', sans-serif; /* Standard font for simplicity */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .monitor-frame {
            background-color: #000;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .monitor-content {
            background-color: #1a1a1a; /* Inner screen color */
            width: 60vw; /* Responsive width */
            height: 40vw; /* Responsive height to maintain aspect ratio */
            max-width: 1000px;
            max-height: 666px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative grid lines for the screen */
        .monitor-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2a2a2a 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
        }

        .logo-main {
            width: 20%; /* Proportional size */
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 5px rgba(196, 163, 90, 0.3));
        }

        .domain-text {
            font-size: 3vw; /* Responsive font size */
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 15%; /* Proportional size */
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .logo-card {
            width: 80%; /* Inside the card */
            height: auto;
        }

        /* Stand for the monitor */
        .monitor-stand {
            width: 20%;
            height: 30px;
            background-color: #1a1a1a;
            margin: 0 auto;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .monitor-base {
            width: 40%;
            height: 10px;
            background-color: #333;
            margin: 0 auto;
            border-radius: 5px;
        }

        /* Replace these placeholders with your actual image paths */
        /* For example: src="images/logo-main.png" */
    </style>
</head>
<body>

    <div class="monitor-container">
        <div class="monitor-frame">
            <div class="monitor-content">
                <!-- Main Kowhai Logo (Line Art) -->
                <img src="path-to-your-kowhai-line-art-logo.png" alt="kowh.ai Main Logo" class="logo-main">
                
                <!-- Domain Name -->
                <h1 class="domain-text">kowh.ai</h1>
                
                <!-- Card with Logo Icon -->
                <div class="card">
                    <img src="path-to-your-kowhai-icon.png" alt="kowh.ai Icon" class="logo-card">
                </div>
            </div>
        </div>
        <!-- Monitor Stand and Base -->
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
    </div>

</body>
</html>
